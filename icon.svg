<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c24"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a5cff"/>
      <stop offset="100%" stop-color="#00b8ff"/>
    </linearGradient>
    <linearGradient id="equalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb340"/>
      <stop offset="100%" stop-color="#ff6a00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#iconGrad)"/>
  </g>
  
  <!-- Equals Sign in Crisp White with Depth -->
  <rect x="160" y="200" width="192" height="34" rx="17" fill="#ffffff"/>
  <rect x="160" y="278" width="192" height="34" rx="17" fill="#ffffff"/>
  
  <!-- Subtle VisionOS Accent Dot -->
  <circle cx="370" cy="142" r="14" fill="url(#equalGrad)"/>
</svg>
