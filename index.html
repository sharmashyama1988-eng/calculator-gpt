<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#eef0f6" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calculator GPT">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<meta name="description" content="Calculator GPT — Smart Calculator with Apple VisionOS Glassmorphism, Offline Mathematical CAS Engine, and Financial Tools">
<title>Calculator GPT — Smart Calculator</title>
<style>
:root{
  --bg:#eef0f6;
  --ink:#0b0b10;
  --sub:#6b6f7b;
  --glass:rgba(255,255,255,.72);
  --glass-specular:rgba(255,255,255,.28);
  --line:rgba(0,0,0,.08);
  --key:#ffffff;
  --keyink:#0b0b10;
  --fn:#d8dae2;
  --fnink:#0b0b10;
  --field:rgba(0,0,0,.055);
  --thumb:#ffffff;
  --op:#ff9f0a;
  --op-gradient:linear-gradient(135deg,#ffb340,#ff9f0a 45%,#ff6a00);
  --op-glow:rgba(255,159,10,.5);
  --acc:#0a84ff;
  --shadow:0 28px 75px rgba(28,32,80,.14);
  --sp:cubic-bezier(.32,.72,0,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#05060b;
    --ink:#f5f5f7;
    --sub:#8e8e93;
    --glass:rgba(26,26,32,.62);
    --glass-specular:rgba(255,255,255,.14);
    --line:rgba(255,255,255,.09);
    --key:#303036;
    --keyink:#ffffff;
    --fn:#a5a5aa;
    --fnink:#000000;
    --field:rgba(255,255,255,.07);
    --thumb:#5e5e63;
    --shadow:0 30px 80px rgba(0,0,0,.65)
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#05060b;
  --ink:#f5f5f7;
  --sub:#8e8e93;
  --glass:rgba(26,26,32,.62);
  --glass-specular:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.09);
  --key:#303036;
  --keyink:#ffffff;
  --fn:#a5a5aa;
  --fnink:#000000;
  --field:rgba(255,255,255,.07);
  --thumb:#5e5e63;
  --shadow:0 30px 80px rgba(0,0,0,.65)
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#eef0f6;
  --ink:#0b0b10;
  --sub:#6b6f7b;
  --glass:rgba(255,255,255,.72);
  --glass-specular:rgba(255,255,255,.28);
  --line:rgba(0,0,0,.08);
  --key:#ffffff;
  --keyink:#0b0b10;
  --fn:#d8dae2;
  --fnink:#0b0b10;
  --field:rgba(0,0,0,.055);
  --thumb:#ffffff;
  --shadow:0 28px 75px rgba(28,32,80,.14)
}

/* Accent Palette Themes */
:root[data-accent="emerald"]{
  --op:#10b981;
  --op-gradient:linear-gradient(135deg,#34d399,#10b981 45%,#059669);
  --op-glow:rgba(16,185,129,.5);
}
:root[data-accent="cyan"]{
  --op:#00b8ff;
  --op-gradient:linear-gradient(135deg,#38bdf8,#00b8ff 45%,#0284c7);
  --op-glow:rgba(0,184,255,.5);
}
:root[data-accent="purple"]{
  --op:#a855f7;
  --op-gradient:linear-gradient(135deg,#c084fc,#a855f7 45%,#7c3aed);
  --op-glow:rgba(168,85,247,.5);
}
:root[data-accent="rose"]{
  --op:#ff2d55;
  --op-gradient:linear-gradient(135deg,#fb7185,#ff2d55 45%,#e11d48);
  --op-glow:rgba(255,45,85,.5);
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  scrollbar-width:none!important;
  -ms-overflow-style:none!important;
}
*::-webkit-scrollbar{
  display:none!important;
  width:0!important;
  height:0!important;
  background:transparent!important;
  -webkit-appearance:none!important;
}
[hidden]{display:none!important}
html,body{
  height:100%;
  overflow:hidden;
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  transition:background-color .5s ease,color .5s ease;
  user-select:none;
  -webkit-user-select:none;
  box-sizing:border-box
}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(95px);opacity:.46;animation:drift 26s ease-in-out infinite alternate}
.bg i:nth-child(1){width:48vmax;height:48vmax;left:-14vmax;top:-16vmax;background:#7a5cff}
.bg i:nth-child(2){width:42vmax;height:42vmax;right:-12vmax;top:20vh;background:#00b8ff;animation-delay:-9s}
.bg i:nth-child(3){width:38vmax;height:38vmax;left:22vw;bottom:-18vmax;background:#ff5fd2;animation-delay:-17s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}to{transform:translate(7vmax,5vmax) scale(1.18)}}
.wrap{
  max-width:340px;
  width:100%;
  height:100vh;
  height:100dvh;
  max-height:100vh;
  margin:0 auto;
  padding:4px 8px 6px;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  overflow:hidden
}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;position:relative;z-index:2;flex:none}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.3px}
.brand em{font-style:normal;font-size:10px;font-weight:650;color:var(--acc);background:var(--field);padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.top-actions{display:flex;align-items:center;gap:6px}
.round{
  width:32px;
  height:32px;
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--glass);
  backdrop-filter:blur(32px);
  -webkit-backdrop-filter:blur(32px);
  color:var(--ink);
  font-size:14px;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:transform .28s var(--sp),background .25s,border-color .25s,box-shadow .25s;
  touch-action:manipulation
}
.round:active{transform:scale(.91);box-shadow:inset 0 2px 6px rgba(0,0,0,.2)}
.grid{
  display:flex;
  justify-content:center;
  align-items:stretch;
  flex:1;
  min-height:0;
  perspective:1200px
}
.glass{
  background:var(--glass);
  backdrop-filter:blur(44px) saturate(1.85);
  -webkit-backdrop-filter:blur(44px) saturate(1.85);
  border:1px solid var(--line);
  border-radius:24px;
  box-shadow:var(--shadow);
  position:relative;
  transition:background-color .5s,border-color .5s
}
.calc{
  animation:rise .85s var(--sp) backwards;
  transition:transform .12s ease-out,box-shadow .4s,width .4s var(--sp);
  will-change:transform;
  padding:6px 8px 6px;
  width:100%;
  height:100%;
  max-height:100%;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  position:relative;
  overflow:hidden
}
.wrap.sciOn .calc{width:100%}

/* Display & Live Expression View */
.disp{
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:stretch;
  padding:2px 6px 2px;
  overflow:hidden;
  position:relative;
  flex:none;
  min-height:64px;
}
.wrap.sciOn .disp{
  min-height:52px;
  padding:1px 6px;
}
.wrap.sciOn .res{
  font-size:32px;
}
.disp-meta{
  display:flex;
  justify-content:flex-start;
  align-items:center;
  gap:8px;
  width:100%;
  margin-bottom:2px;
  z-index:2;
  flex:none;
}
  z-index:2;
  flex:none;
}
.badge-btn{
  border:0;
  cursor:pointer;
  font:inherit;
  font-size:10px;
  font-weight:750;
  letter-spacing:.5px;
  padding:2px 7px;
  border-radius:999px;
  background:var(--field);
  color:var(--ink);
  transition:transform .2s var(--sp),background .2s,color .2s;
  display:inline-flex;
  align-items:center;
  gap:3px;
  touch-action:manipulation;
  line-height:14px;
}
.badge-btn:active{transform:scale(.92)}
.badge-btn:hover{background:var(--line)}

.pill-sm{
  border:0;
  cursor:pointer;
  font:inherit;
  font-size:11px;
  font-weight:600;
  padding:2px 8px;
  border-radius:999px;
  background:var(--field);
  color:var(--ink);
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:transform .2s var(--sp),background .2s,color .2s;
  touch-action:manipulation;
  line-height:14px;
}
.pill-sm:active{transform:scale(.92)}
.pill-sm:hover{background:var(--line)}
.pill-sm .arrow{transition:transform .35s var(--sp)}
.pill-sm.on .arrow{transform:rotate(180deg)}
.pill-sm.on{background:var(--op);color:#ffffff}

.expr{
  max-width:100%;
  overflow-x:auto;
  white-space:nowrap;
  font-size:13px;
  font-weight:400;
  color:var(--sub);
  min-height:18px;
  line-height:18px;
  scrollbar-width:none!important;
  text-align:right;
  width:100%;
  cursor:pointer;
  transition:color .2s;
  padding-bottom:0;
  flex:none;
}
.expr::-webkit-scrollbar{display:none!important}
.res{
  font-size:42px;
  font-weight:250;
  letter-spacing:-1px;
  line-height:1.05;
  white-space:nowrap;
  max-width:100%;
  cursor:pointer;
  text-align:right;
  width:100%;
  transition:font-size .2s var(--sp),color .2s,transform .2s;
  user-select:text;
  -webkit-user-select:text;
  flex:none;
}
.res:active{opacity:.85}

/* Scientific Drawer */
.sciw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--sp);flex:none}
.sciw.on{grid-template-rows:1fr}
.sciw>div{overflow:hidden;min-height:0}
.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:2px 0 4px}

/* Keypad Grid & Button Depth */
.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(5,1fr);
  gap:clamp(3px,1vh,6px);
  flex:1;
  min-height:0;
  align-items:stretch
}
.k{
  position:relative;
  overflow:hidden;
  appearance:none;
  border:0;
  border-radius:999px;
  aspect-ratio:auto;
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font:inherit;
  font-size:clamp(14px,2.5vh,20px);
  background:var(--key);
  color:var(--keyink);
  cursor:pointer;
  transition:transform .16s var(--sp),background .22s,color .22s,box-shadow .22s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  touch-action:manipulation;
  box-shadow:0 2px 5px rgba(0,0,0,.04)
}
.k:hover{filter:brightness(1.06)}
.k:active,.k.hit{
  transform:scale(.92) translateY(2px);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.22), 0 0 12px var(--op-glow);
}
.k:focus-visible,.chip:focus-visible,.pill:focus-visible,.round:focus-visible,.badge-btn:focus-visible{
  outline:2px solid var(--acc);
  outline-offset:1px
}
.k.s{aspect-ratio:auto;height:25px;border-radius:8px;font-size:11px;font-weight:550}
.k.fn{background:var(--fn);color:var(--fnink)}
.k.op{background:var(--op);color:#ffffff;font-size:clamp(16px,2.8vh,22px);box-shadow:0 6px 18px -4px var(--op-glow)}
.k.op.on{background:#ffffff;color:var(--op);box-shadow:0 0 18px var(--op-glow)}
.k.wide{aspect-ratio:auto;grid-column:span 2;border-radius:999px;justify-items:start;padding-left:11%}
.k[data-k='=']{background:var(--op-gradient)}
.k[data-k='=']::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
  transform:translateX(-130%);
  animation:shine 5s ease-in-out infinite 1.5s;
  pointer-events:none
}
.rip{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  transform:scale(0);
  animation:rip .58s ease-out forwards;
  pointer-events:none
}

/* Modal Bottom Sheet */
.sheet{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
.sheet.on{display:flex;animation:fade .22s ease-out}
.panel{
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:340px;
  height:min(500px,94dvh);
  border-radius:24px 24px 0 0;
  min-width:0;
  animation:up .45s var(--sp)
}
@keyframes up{from{transform:translateY(70px);opacity:0}}
@keyframes fade{from{opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 0}
.sh b{font-size:16px;font-weight:650}
.x{width:28px;height:28px;font-size:13px}
.seg{
  position:relative;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  margin:8px 14px 0;
  padding:2px;
  background:var(--field);
  border-radius:10px
}
.seg button{
  position:relative;
  z-index:1;
  border:0;
  background:none;
  color:var(--ink);
  font:inherit;
  font-size:12px;
  font-weight:600;
  padding:6px 0;
  cursor:pointer;
  opacity:.55;
  transition:opacity .25s;
  touch-action:manipulation
}
.seg button[aria-selected=true]{opacity:1}
.thumb{
  position:absolute;
  top:3px;
  bottom:3px;
  left:3px;
  width:calc((100% - 6px)/4);
  background:var(--thumb);
  border-radius:9px;
  box-shadow:0 2px 10px rgba(0,0,0,.15);
  transition:transform .45s var(--sp)
}
.views{position:relative;flex:1;min-height:0;overflow:hidden}
.view{
  position:absolute;
  inset:0;
  padding:16px 18px 18px;
  overflow-y:auto;
  overflow-x:hidden;
  display:none;
  flex-direction:column;
  gap:12px;
  scrollbar-width:none!important;
  -ms-overflow-style:none!important;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.view::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.view.on{display:flex;animation:in .35s var(--sp)}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}}
.thread{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:none!important;
  -ms-overflow-style:none!important;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
.thread::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.empty{color:var(--sub);font-size:14px;text-align:center;margin:auto;max-width:280px;line-height:1.5}
.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none!important;
  -ms-overflow-style:none!important;
  flex:none;
  -webkit-overflow-scrolling:touch;
  padding:2px 0 4px;
}
.chips::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
.chips.wrapc{flex-wrap:wrap;overflow:visible;padding:0}
.chip{
  flex:none;
  border:0;
  border-radius:999px;
  padding:8px 14px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:transform .22s var(--sp),background .22s,color .22s;
  touch-action:manipulation;
  white-space:nowrap;
}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--acc);color:#ffffff}
.bub{
  align-self:flex-end;
  background:var(--acc);
  color:#ffffff;
  padding:9px 15px;
  border-radius:18px 18px 4px 18px;
  max-width:85%;
  font-size:15px;
  animation:pop .3s var(--sp);
  word-break:break-word;
  overflow-wrap:break-word;
}

/* Structured Vertical Results Card */
.card{
  background:var(--field);
  border-radius:20px;
  padding:14px 16px;
  animation:pop .4s var(--sp);
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:6px;
  border:1px solid var(--line);
  margin-bottom:8px;
  width:100%;
  max-width:100%;
  box-sizing:border-box;
  overflow-wrap:break-word;
  word-break:break-word;
}
.card .t{
  font-size:11px;
  color:var(--sub);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:2px
}
.card .v{
  font-size:32px;
  font-weight:300;
  letter-spacing:-.5px;
  cursor:pointer;
  line-height:1.15;
  margin-bottom:2px
}
.card-rows{
  width:100%;
  display:flex;
  flex-direction:column;
  margin:4px 0
}
.card-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line);
  width:100%;
  font-size:14px
}
.card-row:last-child{border-bottom:none}
.card-row .lbl{color:var(--sub);font-weight:500}
.card-row .val{
  font-weight:600;
  color:var(--ink);
  cursor:pointer;
  text-align:right
}
.card-row .val:hover{color:var(--op)}
.card .s{
  font-size:12px;
  color:var(--sub);
  line-height:1.45;
  margin-top:4px
}
.steps-wrap{width:100%;margin:6px 0 2px}
.step-toggle{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:var(--field);
  border:1px solid var(--line);
  color:var(--ink);
  font:inherit;
  font-size:12px;
  font-weight:600;
  padding:7px 12px;
  border-radius:12px;
  cursor:pointer;
  transition:background .2s,transform .18s var(--sp);
  touch-action:manipulation
}
.step-toggle:active{transform:scale(.98)}
.step-toggle .arr{transition:transform .3s var(--sp)}
.step-toggle.open .arr{transform:rotate(180deg)}
.steps-box{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:10px 12px;
  background:var(--field);
  border-radius:14px;
  margin-top:6px;
  border:1px solid var(--line);
  animation:pop .3s var(--sp)
}
.step-item{
  font-size:12.5px;
  color:var(--ink);
  line-height:1.45;
  border-bottom:1px dashed var(--line);
  padding-bottom:5px
}
.step-item:last-child{border-bottom:none;padding-bottom:0}
.step-insight{
  font-size:12px;
  color:var(--sub);
  line-height:1.4;
  padding-top:4px;
  border-top:1px solid var(--line)
}

.askbar{display:flex;gap:8px;flex:none}
.in{
  width:100%;
  border:1px solid transparent;
  border-radius:14px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:16px;
  padding:12px 14px;
  outline:none;
  transition:box-shadow .22s,border-color .22s
}
.in:focus{box-shadow:0 0 0 2px var(--acc);border-color:transparent}
.send{
  flex:none;
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:var(--acc);
  color:#ffffff;
  font-size:20px;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:transform .22s var(--sp),background .2s;
  touch-action:manipulation
}
.send:active{transform:scale(.9)}
.fld{display:flex;flex-direction:column;gap:5px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.row span{color:var(--sub)}
.row b{font-weight:550;cursor:pointer}
.row.big b{font-size:32px;font-weight:300}
.cv{display:flex;gap:8px}
.cv .in:first-child{flex:1.4}
.cv select.in{flex:1;appearance:none;cursor:pointer}
.swap{align-self:center}
.pill{
  border:0;
  border-radius:999px;
  padding:7px 15px;
  background:var(--field);
  color:var(--ink);
  font:inherit;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:transform .22s var(--sp),background .22s,color .22s;
  touch-action:manipulation
}
.pill:active{transform:scale(.94)}
.pill[aria-pressed=true]{background:var(--acc);color:#ffffff}
.out{display:flex;align-items:center;font-size:20px;cursor:pointer;overflow:hidden}
.hi{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:12px;
  width:100%;
  border:0;
  border-bottom:1px solid var(--line);
  background:none;
  color:var(--ink);
  padding:12px 4px;
  font:inherit;
  cursor:pointer;
  text-align:left;
  transition:background .2s;
  touch-action:manipulation
}
.hi span{color:var(--sub);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi b{font-weight:550;white-space:nowrap}
.toast{
  position:fixed;
  left:50%;
  bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,20px) scale(.95);
  opacity:0;
  background:var(--ink);
  color:var(--bg);
  padding:10px 18px;
  border-radius:999px;
  font-size:14px;
  font-weight:550;
  transition:opacity .3s var(--sp),transform .3s var(--sp);
  pointer-events:none;
  z-index:90;
  box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* Apps Launcher & Accent Row */
.launch{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  background:rgba(0,0,0,.28);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  padding:calc(64px + env(safe-area-inset-top,0px)) 16px 16px
}
.launch.on{display:block;animation:fade .22s ease-out}
.lcard{
  width:min(350px,100%);
  margin-left:max(0px,calc((100vw - 1008px)/2));
  padding:20px 16px 16px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px 10px;
  transform-origin:top left;
  animation:pop .42s var(--sp)
}
.tile{
  border:0;
  background:none;
  color:var(--ink);
  font:inherit;
  font-size:12px;
  font-weight:550;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  cursor:pointer;
  transition:transform .22s var(--sp);
  touch-action:manipulation
}
.tile:active{transform:scale(.92)}
.tile:focus-visible{outline:3px solid var(--acc);outline-offset:4px;border-radius:16px}
.ic{
  width:60px;
  height:60px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:26px;
  color:#ffffff;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
  transition:box-shadow .25s
}
.tile[data-on=true] .ic{box-shadow:0 0 0 3px var(--acc)}

.accent-box{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  background:var(--field);
  border-radius:16px;
  border:1px solid var(--line);
  margin-top:4px
}
.accent-box span{font-size:13px;font-weight:600;color:var(--sub)}
.acc-dots{display:flex;gap:10px}
.adot{
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  transition:transform .2s var(--sp),border-color .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.2);
  touch-action:manipulation
}
.adot:hover{transform:scale(1.15)}
.adot.active{border-color:var(--ink);transform:scale(1.18)}

.lf{
  grid-column:1/-1;
  text-align:center;
  font-size:12px;
  color:var(--sub);
  padding-top:10px;
  border-top:1px solid var(--line)
}
.lf a{color:var(--acc);text-decoration:none}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes rise{from{opacity:0;transform:translateY(36px) scale(.97)}}
@keyframes kin{from{opacity:0;transform:scale(.6) translateY(14px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes fl{from{opacity:1}to{opacity:0}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes dot{40%{transform:translateY(-5px);opacity:.4}}
@keyframes rev{from{opacity:0;filter:blur(8px);letter-spacing:4px}}
@keyframes shine{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.fx{position:absolute;inset:0;width:100%;height:100%}
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:60;
  opacity:.045;
  mix-blend-mode:overlay;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22><filter id=%22n%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%22.8%22 numOctaves=%222%22 stitchTiles=%22stitch%22/></filter><rect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22/></svg>')
}
.glass::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:inherit;
  background:radial-gradient(340px circle at var(--mx,50%) var(--my,0%),var(--glass-specular),transparent 65%);
  opacity:0;
  transition:opacity .35s;
  pointer-events:none
}
.glass:hover::before{opacity:1}
.calc::after{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  padding:1.5px;
  background:conic-gradient(from var(--a),transparent 0 62%,#7a5cff,#00b8ff 85%,transparent);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  animation:spin 7.5s linear infinite;
  pointer-events:none
}
.keys .k{animation:kin .55s var(--sp) backwards;animation-delay:calc(var(--i)*25ms + .15s)}
.disp.flash::after{
  content:'';
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 85% 100%,rgba(122,92,255,.45),transparent 64%);
  animation:fl .75s ease-out forwards;
  pointer-events:none
}
.res.bump{animation:bump .32s var(--sp);transform-origin:100% 50%}
.dots{
  align-self:flex-start;
  display:flex;
  gap:5px;
  padding:14px 16px;
  background:var(--field);
  border-radius:20px;
  animation:pop .3s var(--sp);
  border:1px solid var(--line)
}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--sub);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
.card .v{animation:rev .65s var(--sp) .08s backwards}
.hi{animation:pop .35s var(--sp) backwards;animation-delay:calc(var(--i)*30ms)}
#apps svg{transition:transform .45s var(--sp)}
#apps.open svg{transform:rotate(90deg) scale(1.15)}
.launch.on .tile{animation:pop .45s var(--sp) backwards}
.tile:nth-child(1){animation-delay:.03s}
.tile:nth-child(2){animation-delay:.06s}
.tile:nth-child(3){animation-delay:.09s}
.tile:nth-child(4){animation-delay:.12s}
.tile:nth-child(5){animation-delay:.15s}
.tile:nth-child(6){animation-delay:.18s}
@media(min-width:720px){
  .sheet{align-items:center}
  .panel{border-radius:34px;height:min(660px,85dvh)}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
/* ==========================================================================
   1. CORE UTILITIES & HAPTIC / AUDIO FEEDBACK
   ========================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const fmt=(n,d=8)=>{
  if(!isFinite(n))return'Error';
  const s=+n.toPrecision(12);
  return Math.abs(s)>=1e15||(s&&Math.abs(s)<1e-7)?s.toExponential(5).replace(/\.?0+e/,'e'):s.toLocaleString('en-IN',{maximumFractionDigits:d});
};
const fm=n=>isFinite(n)?'₹'+(+n).toLocaleString('en-IN',{maximumFractionDigits:2}):'—';
const rw=n=>String(+n.toPrecision(12));

let actx=null;
function playClick(){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const osc=actx.createOscillator(),g=actx.createGain();
    osc.type='sine';
    const now=actx.currentTime;
    osc.frequency.setValueAtTime(1400,now);
    osc.frequency.exponentialRampToValueAtTime(160,now+0.012);
    g.gain.setValueAtTime(0.04,now);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.012);
    osc.connect(g);
    g.connect(actx.destination);
    osc.start(now);
    osc.stop(now+0.013);
  }catch{}
}

function haptic(ms=15){
  playClick();
  if(navigator.vibrate)try{navigator.vibrate(ms)}catch{}
}

/* ==========================================================================
   2. STANDARD MATH ENGINE
   ========================================================================== */
let deg=true;
const D=x=>deg?x*Math.PI/180:x;
const FN={
  sin:x=>Math.abs(x%180===0&&deg?0:Math.sin(D(x))),
  cos:x=>{
    if(deg&&Math.abs(x%180)===90)return 0;
    return Math.cos(D(x));
  },
  tan:x=>{
    if(deg&&Math.abs(x%180)===90)throw'Undefined';
    return Math.tan(D(x));
  },
  log:Math.log10,
  ln:Math.log,
  sqrt:Math.sqrt,
  PI:Math.PI,
  E:Math.E
};

function ev(s){
  s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\^/g,'**').replace(/π/g,'PI').replace(/√/g,'sqrt');
  s=s.replace(/(\d+\.?\d*)([+-])(\d+\.?\d*)%/g,'$1$2($1*$3/100)').replace(/(\d+\.?\d*)%/g,'($1/100)');
  s=s.replace(/(\d|\)|PI|E)\s*(?=\(|PI|E|sin|cos|tan|log|ln|sqrt)/g,'$1*').replace(/\)(?=\d)/g,')*').replace(/(PI|E)(?=\d)/g,'$1*');
  s=s.replace(/[+\-*/.(]+$/,'');
  if(!/^[\d+\-*/().\sA-Za-z]*$/.test(s)||(s.match(/[A-Za-z]+/g)||[]).some(w=>!(w in FN)))throw 0;
  const o=(s.match(/\(/g)||[]).length-(s.match(/\)/g)||[]).length;
  s+=')'.repeat(Math.max(0,o));
  const r=new Function(...Object.keys(FN),'"use strict";return('+s+')')(...Object.values(FN));
  if(typeof r!=='number'||!isFinite(r))throw 0;
  return Math.abs(r)<1e-12?0:r;
}
const calc=s=>{try{return s?ev(s):null}catch{return null}};

/* ==========================================================================
   3. PURE OFFLINE MATHEMATICAL ENGINES (WITH VERTICAL STRUCTURED ROWS)
   ========================================================================== */

/* A. Statistics Engine (Structured Breakdown Rows) */
function solveStats(q){
  if(!/(?:mean|median|mode|average|avg|variance|standard deviation|std dev|\bsd\b|range)\b/i.test(q))return null;
  const nums=(q.match(/-?\d+\.?\d*/g)||[]).map(Number);
  if(nums.length<2)return null;
  const N=nums.length,sorted=[...nums].sort((a,b)=>a-b),sum=nums.reduce((a,b)=>a+b,0),mean=sum/N;
  const mid=Math.floor(N/2),median=N%2!==0?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
  const counts={};nums.forEach(x=>counts[x]=(counts[x]||0)+1);
  let maxCount=0;for(let k in counts)if(counts[k]>maxCount)maxCount=counts[k];
  let modes=[];if(maxCount>1){for(let k in counts)if(counts[k]===maxCount)modes.push(+k)}
  const modeStr=modes.length?modes.join(', '):'None';
  const range=sorted[N-1]-sorted[0];
  const variance=nums.reduce((acc,val)=>acc+Math.pow(val-mean,2),0)/N,sd=Math.sqrt(variance);
  
  const wantsMode=/mode/i.test(q),wantsMedian=/median/i.test(q),wantsMean=/mean|average|avg/i.test(q);
  
  if(wantsMean&&wantsMedian&&wantsMode){
    return{
      t:'Statistics Breakdown',
      raw:mean,
      v:null,
      rows:[
        ['Mean (Average)', fmt(mean,2)],
        ['Median (Middle)', fmt(median,2)],
        ['Mode (Most Frequent)', modeStr],
        ['Range (Max − Min)', fmt(range,2)],
        ['Standard Deviation (σ)', fmt(sd,3)],
        ['Total Count (N)', String(N)]
      ],
      s:`Sorted Data: [${sorted.join(', ')}]`
    };
  }
  if(wantsMedian&&!wantsMean&&!wantsMode){
    return{
      t:'Median Calculation',
      raw:median,
      v:fmt(median,2),
      rows:[
        ['Median (Middle Value)', fmt(median,2)],
        ['Total Elements (N)', String(N)],
        ['Data Range', `${sorted[0]} to ${sorted[N-1]}`]
      ],
      s:`Sorted Data: [${sorted.join(', ')}]`
    };
  }
  if(wantsMode&&!wantsMean&&!wantsMedian){
    return{
      t:'Mode Calculation',
      raw:modes[0]??null,
      v:modeStr,
      rows:[
        ['Mode', modeStr],
        ['Highest Frequency', `${maxCount} times`],
        ['Total Elements', String(N)]
      ],
      s:`Counts: ${JSON.stringify(counts).replace(/[{"}]/g,'').replace(/,/g,', ')}`
    };
  }
  return{
    t:'Average & Statistical Summary',
    raw:mean,
    v:fmt(mean,2),
    rows:[
      ['Mean (Average)', fmt(mean,2)],
      ['Median', fmt(median,2)],
      ['Mode', modeStr],
      ['Sum of Elements', fmt(sum,2)],
      ['Total Elements (N)', String(N)]
    ],
    s:`Sorted Data: [${sorted.join(', ')}]`
  };
}

/* B. Relative Speed & Train Problems (Structured Breakdown Rows) */
function solveSpeedDistance(q){
  const isSpeedDist=/(?:train|speed|km\/?h|kmph|mph|distance|travel|opposite|same direction|ek dusre|milne|chal rahi|chal rahe|ghante|hours?|kitne time|how long|how much time)\b/i.test(q);
  if(!isSpeedDist)return null;
  const nums=(q.match(/\d+\.?\d*/g)||[]).map(Number);
  if(nums.length<2)return null;
  const isOpposite=/opposite|aamne|samne|towards each other|ek dusre ki taraf/i.test(q);
  const isSame=/same direction|ek hi disha|ek hi taraf/i.test(q);

  if(nums.length>=3){
    let s1=nums[0],s2=nums[1],dist=nums[2];
    if(nums[2]>nums[0]&&nums[2]>nums[1]){dist=nums[2];s1=nums[0];s2=nums[1];}
    else if(nums[0]>nums[1]&&nums[0]>nums[2]){dist=nums[0];s1=nums[1];s2=nums[2];}
    const relSpeed=(isSame&&!isOpposite)?Math.abs(s1-s2):(s1+s2);
    if(relSpeed===0)return{t:'Relative Speed',raw:null,v:'Never meet',s:'Relative speed is 0 km/h.'};
    const timeHours=dist/relSpeed,hrs=Math.floor(timeHours),mins=Math.round((timeHours-hrs)*60);
    const timeFormatted=hrs>0?(mins>0?`${hrs}h ${mins}m (${fmt(timeHours,2)} hrs)`:`${hrs} hours (${hrs} ghante)`):`${mins} minutes`;
    const dirText=(isSame&&!isOpposite)?'Same direction (subtract speeds)':'Opposite direction (add speeds)';

    return{
      t:'Relative Speed (Train Problem)',
      raw:timeHours,
      v:timeFormatted,
      rows:[
        ['Time Required', timeFormatted],
        ['Relative Speed', `${relSpeed} km/h (${dirText})`],
        ['Distance to Cover', `${dist} km`],
        ['Speed of Train 1', `${s1} km/h`],
        ['Speed of Train 2', `${s2} km/h`],
        ['Formula', 'Time = Distance ÷ Relative Speed']
      ],
      s:`Calculation: ${dist} km ÷ ${relSpeed} km/h = ${fmt(timeHours,2)} hours`
    };
  }
  if(/(?:distance|kitni door|door|how far)/i.test(q)&&/(?:speed|km\/?h|kmph)/i.test(q)&&/(?:hours?|hrs?|ghante|mins?|minute)/i.test(q)){
    const s=nums[0],t=nums[1],d=s*t;
    return{
      t:'Distance Traveled',
      raw:d,
      v:`${fmt(d)} km`,
      rows:[
        ['Total Distance', `${fmt(d)} km`],
        ['Speed', `${s} km/h`],
        ['Time', `${t} hours`]
      ],
      s:`Distance = Speed × Time = ${s} × ${t} = ${fmt(d)} km`
    };
  }
  if(/(?:time|kitne ghante|how long|ghante)/i.test(q)&&nums.length>=2){
    const dist=Math.max(nums[0],nums[1]),speed=Math.min(nums[0],nums[1]),t=dist/speed;
    const hrs=Math.floor(t),mins=Math.round((t-hrs)*60);
    return{
      t:'Travel Time Calculation',
      raw:t,
      v:hrs>0?(mins>0?`${hrs}h ${mins}m`:`${hrs} hours`):`${mins} mins`,
      rows:[
        ['Time Required', `${fmt(t,2)} hours`],
        ['Distance', `${dist} km`],
        ['Speed', `${speed} km/h`]
      ],
      s:`Time = Distance ÷ Speed = ${dist} ÷ ${speed} = ${fmt(t,2)} hours`
    };
  }
  return null;
}

/* C. Symbolic Calculus & Differentiation */
function differentiatePoly(s){
  s=s.replace(/\s+/g,'').replace(/−/g,'-');
  const terms=s.match(/[+-]?[^+-]+/g);if(!terms)return null;const dTerms=[];
  for(let term of terms){
    if(!term)continue;let sign=1;
    if(term.startsWith('+'))term=term.slice(1);else if(term.startsWith('-')){sign=-1;term=term.slice(1)}
    if(!/x/i.test(term))continue;
    let m=term.match(/^(\d*\.?\d*)x$/i);
    if(m){const coef=m[1]===''?1:+m[1];dTerms.push({c:sign*coef,exp:0});continue;}
    m=term.match(/^(\d*\.?\d*)x(?:\^|²|³)(\d+)?$/i);
    if(m){const coef=m[1]===''?1:+m[1];let exp=2;if(term.includes('³'))exp=3;else if(m[2])exp=+m[2];dTerms.push({c:sign*coef*exp,exp:exp-1});continue;}
  }
  if(dTerms.length===0)return'0';
  return dTerms.map((t,idx)=>{
    const absC=Math.abs(t.c),signStr=idx===0?(t.c<0?'-':''):(t.c<0?' - ':' + ');
    const cStr=(absC===1&&t.exp>0)?'':absC,xStr=t.exp===0?'':(t.exp===1?'x':`x^${t.exp}`);
    return signStr+(cStr||(xStr?'':'1'))+xStr;
  }).join('');
}

function solveDerivative(q){
  if(!/(?:diff|differentiate|derivative|d\/dx)\b/i.test(q))return null;
  let expr=q.replace(/.*?(?:differentiate|derivative of|diff|d\/dx)\s*/i,'').replace(/\s*(?:with respect to|w\.?r\.?t\.?)\s*[a-z].*/i,'').trim().replace(/[?.,]$/g,'').trim();
  
  let res=null;
  let m=expr.match(/^sin\((.+)\)$/i);
  if(m){
    const u=m[1].trim();
    if(u==='x')res={v:'cos(x)',s:'d/dx [sin(x)] = cos(x)',r:'Standard Derivative'};
    else if(u==='x^2'||u==='x²')res={v:'2x · cos(x²)',s:'Chain Rule: d/dx[sin(x²)] = cos(x²) · d/dx[x²] = 2x · cos(x²)',r:'Chain Rule'};
    else{const du=differentiatePoly(u);res={v:`${du} · cos(${u})`,s:`Chain Rule: d/dx[sin(${u})] = cos(${u}) · (${du})`,r:'Chain Rule'};}
  }
  if(!res){
    m=expr.match(/^cos\((.+)\)$/i);
    if(m){
      const u=m[1].trim();
      if(u==='x')res={v:'-sin(x)',s:'d/dx [cos(x)] = -sin(x)',r:'Standard Derivative'};
      else if(u==='x^2'||u==='x²')res={v:'-2x · sin(x²)',s:'Chain Rule: d/dx[cos(x²)] = -sin(x²) · 2x',r:'Chain Rule'};
      else{const du=differentiatePoly(u);res={v:`-(${du}) · sin(${u})`,s:`Chain Rule: d/dx[cos(${u})] = -sin(${u}) · (${du})`,r:'Chain Rule'};}
    }
  }
  if(!res){
    m=expr.match(/^tan\((.+)\)$/i);
    if(m){
      const u=m[1].trim();
      if(u==='x')res={v:'sec²(x)',s:'d/dx [tan(x)] = sec²(x)',r:'Standard Derivative'};
      else if(u==='x^2'||u==='x²')res={v:'2x · sec²(x²)',s:'Chain Rule: d/dx[tan(x²)] = sec²(x²) · 2x',r:'Chain Rule'};
    }
  }
  if(!res){
    m=expr.match(/^(?:e\^?\((.+)\)|e\^([a-z0-9^]+))/i);
    if(m){
      const u=(m[1]||m[2]).trim();
      if(u==='x')res={v:'e^x',s:'d/dx [e^x] = e^x',r:'Standard Exponential'};
      else if(u==='x^2'||u==='x²')res={v:'2x · e^(x²)',s:'Chain Rule: d/dx[e^(x²)] = e^(x²) · 2x',r:'Chain Rule'};
      else{const du=differentiatePoly(u);res={v:`${du} · e^(${u})`,s:`Chain Rule: d/dx[e^(${u})] = e^(${u}) · (${du})`,r:'Chain Rule'};}
    }
  }
  if(!res){
    m=expr.match(/^(?:ln|log)\((.+)\)$/i);
    if(m){
      const u=m[1].trim();
      if(u==='x')res={v:'1/x',s:'d/dx [ln(x)] = 1/x',r:'Standard Logarithm'};
      else{const du=differentiatePoly(u);res={v:`(${du}) / (${u})`,s:`Chain Rule: d/dx[ln(${u})] = (${du}) / (${u})`,r:'Chain Rule'};}
    }
  }
  if(!res){
    const poly=differentiatePoly(expr);
    if(poly)res={v:poly,s:`Power Rule: d/dx [a·x^n] = a·n·x^(n-1)`,r:'Power Rule'};
  }

  if(res){
    return{
      t:'Symbolic Derivative (d/dx)',
      raw:null,
      v:res.v,
      rows:[
        ['Derivative d/dx', res.v],
        ['Input Function', expr],
        ['Rule Applied', res.r]
      ],
      s:res.s
    };
  }
  return null;
}

/* D. Algebraic Polynomial Expansion & Factorisation */
function alg(q){
  const sup={2:'²',3:'³'};
  let m=q.match(/([a-z0-9]+)\s*(?:square|²|\^2)\s*[-−]\s*([a-z0-9]+)\s*(?:square|²|\^2)/);
  if(m){
    const a=+m[1],b=+m[2],fz=`(${m[1]} + ${m[2]})(${m[1]} − ${m[2]})`;
    if(!isNaN(a)&&!isNaN(b)){
      const r=a*a-b*b;
      return{
        t:'Algebraic Identity (a² − b²)',
        raw:r,
        v:fmt(r),
        rows:[
          ['Calculated Value', fmt(r)],
          ['Factorised Form', fz],
          ['Identity', 'a² − b² = (a + b)(a − b)']
        ],
        s:`${a}² − ${b}² = ${fz} = ${fmt(r)}`
      };
    }
    return{
      t:'Algebraic Factorisation',
      raw:null,
      v:fz,
      rows:[
        ['Factorised Result', fz],
        ['Formula', 'a² − b² = (a + b)(a − b)']
      ],
      s:`${m[1]}² − ${m[2]}² = ${fz}`
    };
  }
  m=q.match(/\(?\s*(\d*\.?\d*[a-z]?)\s*([+\-−])\s*(\d*\.?\d*[a-z]?)\s*\)?\s*(?:whole\s*|ka\s*)?(square|squared|cube|cubed|\^2|\^3|²|³)/);
  if(!m||!m[1]||!m[3])return null;
  const n=/3|cub|³/.test(m[4])?3:2,s=m[2]==='+'?1:-1,P=x=>{const k=x.match(/^(\d*\.?\d*)([a-z]?)$/);return k&&{c:k[1]===''?1:+k[1],v:k[2]}},A=P(m[1]),B=P(m[3]);
  if(!A||!B)return null;
  const lab=`(${m[1]} ${s>0?'+':'−'} ${m[3]})${sup[n]}`;
  if(!A.v&&!B.v){
    const r=(A.c+s*B.c)**n;
    return{
      t:n===2?'Algebraic Expansion (Square)':'Algebraic Expansion (Cube)',
      raw:r,
      v:fmt(r),
      rows:[
        ['Expanded Result', fmt(r)],
        ['Expression', lab],
        ['Inner Sum', fmt(A.c+s*B.c)]
      ],
      s:`${lab} = ${fmt(A.c+s*B.c)}${sup[n]} = ${fmt(r)}`
    };
  }
  const C=[[1,2,1],[1,3,3,1]][n-2],mp={};
  for(let k=0;k<=n;k++){const e={};if(A.v)e[A.v]=(e[A.v]||0)+n-k;if(B.v)e[B.v]=(e[B.v]||0)+k;const key=Object.keys(e).sort().map(v=>v+e[v]).join('');mp[key]=mp[key]||{c:0,e};mp[key].c+=C[k]*A.c**(n-k)*(s*B.c)**k}
  const v=Object.values(mp).filter(t=>t.c).map((t,i)=>{const vs=Object.keys(t.e).sort().filter(x=>t.e[x]).map(x=>x+(t.e[x]>1?sup[t.e[x]]||'^'+t.e[x]:'')).join(''),ab=Math.abs(t.c)===1&&vs?'':fmt(Math.abs(t.c));return(i?(t.c<0?' − ':' + '):(t.c<0?'−':''))+ab+vs}).join('');
  return{
    t:'Polynomial Expansion',
    raw:null,
    v,
    rows:[
      ['Expanded Polynomial', v],
      ['Original Formula', lab],
      ['Degree', String(n)]
    ],
    s:`${lab} = ${v}`
  };
}

/* E. Quadratic & Linear Equation Solver */
function solveEquation(q){
  if(!/(?:solve|roots? of|find x|equation|samikaran)\b/i.test(q)&&!q.includes('='))return null;
  let eq=q.replace(/.*?(?:solve|roots? of|find x|equation|samikaran)\s*/i,'').replace(/[?]/g,'').trim();
  if(!eq.includes('='))eq+=' = 0';
  const parts=eq.split('=');if(parts.length!==2)return null;
  let lhs=parts[0].trim().replace(/\s+/g,'').replace(/−/g,'-');
  let rhs=parts[1].trim().replace(/\s+/g,'').replace(/−/g,'-');

  if(/[xX](?:\^2|²)/.test(lhs)||/[xX](?:\^2|²)/.test(rhs)){
    let a=0,b=0,c=0;
    const parseSide=(str,mult)=>{
      const terms=str.match(/[+-]?[^+-]+/g)||[];
      for(let t of terms){
        if(/[xX](?:\^2|²)/.test(t)){
          let coefStr=t.replace(/[xX](?:\^2|²)/,'');
          let val=(coefStr===''||coefStr==='+')?1:(coefStr==='-'?-1:+coefStr);
          a+=mult*val;
        }else if(/[xX]/.test(t)){
          let coefStr=t.replace(/[xX]/,'');
          let val=(coefStr===''||coefStr==='+')?1:(coefStr==='-'?-1:+coefStr);
          b+=mult*val;
        }else{
          c+=mult*(+t);
        }
      }
    };
    parseSide(lhs,1);parseSide(rhs,-1);
    if(a!==0){
      const D=b*b-4*a*c;
      if(D>0){
        const x1=(-b+Math.sqrt(D))/(2*a),x2=(-b-Math.sqrt(D))/(2*a);
        return{
          t:'Quadratic Equation (2 Roots)',
          raw:x1,
          v:null,
          rows:[
            ['Root x₁', fmt(x1,3)],
            ['Root x₂', fmt(x2,3)],
            ['Discriminant (D)', fmt(D)],
            ['Nature of Roots', 'Real & Distinct'],
            ['Formula', 'x = (-b ± √D) ÷ 2a']
          ],
          s:`Equation coefficients: a=${a}, b=${b}, c=${c} | D = b² − 4ac = ${fmt(D)}`
        };
      }else if(D===0){
        const x=-b/(2*a);
        return{
          t:'Quadratic Equation (Repeated Root)',
          raw:x,
          v:`x = ${fmt(x,3)}`,
          rows:[
            ['Repeated Root (x)', fmt(x,3)],
            ['Discriminant (D)', '0'],
            ['Nature of Roots', 'Real & Equal']
          ],
          s:`Repeated root x = -b / 2a = ${fmt(x,3)}`
        };
      }else{
        const real=-b/(2*a),imag=Math.sqrt(-D)/(2*a);
        return{
          t:'Quadratic Equation (Complex Roots)',
          raw:null,
          v:`x = ${fmt(real,2)} ± ${fmt(Math.abs(imag),2)}i`,
          rows:[
            ['Real Part', fmt(real,3)],
            ['Imaginary Part', `±${fmt(Math.abs(imag),3)}i`],
            ['Discriminant (D)', fmt(D)]
          ],
          s:`Discriminant D = ${fmt(D)} (< 0). Roots are complex conjugate pairs.`
        };
      }
    }
  }

  if(/[xX]/.test(eq)&&!/[xX](?:\^|²|³)/.test(eq)){
    let a=0,c=0;
    const lTerms=lhs.match(/[+-]?[^+-]+/g)||[];
    for(let t of lTerms){
      if(/[xX]/.test(t)){let coefStr=t.replace(/[xX]/,'');a+=(coefStr===''||coefStr==='+')?1:(coefStr==='-'?-1:+coefStr);}
      else c-=+t;
    }
    const rTerms=rhs.match(/[+-]?[^+-]+/g)||[];
    for(let t of rTerms){
      if(/[xX]/.test(t)){let coefStr=t.replace(/[xX]/,'');a-=(coefStr===''||coefStr==='+')?1:(coefStr==='-'?-1:+coefStr);}
      else c+=+t;
    }
    if(a!==0){
      const x=c/a;
      return{
        t:'Linear Equation Solution',
        raw:x,
        v:`x = ${fmt(x,3)}`,
        rows:[
          ['Solution (x)', fmt(x,3)],
          ['Simplified Form', `${a}x = ${fmt(c)}`],
          ['Equation', eq]
        ],
        s:`${a}x = ${fmt(c)}  ⟹  x = ${fmt(c)} ÷ ${a} = ${fmt(x,3)}`
      };
    }
  }
  return null;
}

/* F. Work & Time Aptitude */
function solveTimeWork(q){
  if(!/(?:work|kaam|together|milkar|dono milkar)\b/i.test(q))return null;
  const m=q.match(/(\d+)\s*(?:days?|din).*?(\d+)\s*(?:days?|din)/i);
  if(m){
    const d1=+m[1],d2=+m[2],totalDays=(d1*d2)/(d1+d2);
    return{
      t:'Work & Time (Dono Milkar)',
      raw:totalDays,
      v:`${fmt(totalDays,2)} days`,
      rows:[
        ['Together Work Time', `${fmt(totalDays,2)} days (${fmt(totalDays,2)} din)`],
        ['Person A Rate', `1/${d1} per day (${d1} days)`],
        ['Person B Rate', `1/${d2} per day (${d2} days)`],
        ['Combined Rate', `1/${fmt(totalDays,2)} per day`]
      ],
      s:`Formula: (A × B) ÷ (A + B) = (${d1} × ${d2}) ÷ (${d1} + ${d2}) = ${fmt(totalDays,2)} days`
    };
  }
  return null;
}

/* G. Profit & Loss */
function solveProfitLoss(q){
  if(!/(?:profit|loss|gain|cost price|selling price|cp|sp|khareeda|becha|faida|nuksan)\b/i.test(q))return null;
  const nums=(q.match(/\d+\.?\d*/g)||[]).map(Number);
  if(nums.length<2)return null;
  const cp=nums[0],sp=nums[1],diff=sp-cp,pct=(diff/cp)*100;
  if(diff>=0)return{
    t:'Profit Calculation',
    raw:diff,
    v:`Profit: ₹${fmt(diff,2)}`,
    rows:[
      ['Total Profit', `₹${fmt(diff,2)}`],
      ['Profit Margin', `${fmt(pct,2)}%`],
      ['Selling Price (SP)', `₹${fmt(sp,2)}`],
      ['Cost Price (CP)', `₹${fmt(cp,2)}`]
    ],
    s:`SP (₹${sp}) − CP (₹${cp}) = ₹${fmt(diff,2)} profit. (${diff} ÷ ${cp}) × 100 = ${fmt(pct,2)}%`
  };
  return{
    t:'Loss Calculation',
    raw:Math.abs(diff),
    v:`Loss: ₹${fmt(Math.abs(diff),2)}`,
    rows:[
      ['Total Loss', `₹${fmt(Math.abs(diff),2)}`],
      ['Loss Percentage', `${fmt(Math.abs(pct),2)}%`],
      ['Cost Price (CP)', `₹${fmt(cp,2)}`],
      ['Selling Price (SP)', `₹${fmt(sp,2)}`]
    ],
    s:`CP (₹${cp}) − SP (₹${sp}) = ₹${fmt(Math.abs(diff),2)} loss. (${Math.abs(diff)} ÷ ${cp}) × 100 = ${fmt(Math.abs(pct),2)}%`
  };
}

/* H. Number Theory */
function solveNumberTheory(q){
  let m=q.match(/(?:lcm|lowest common multiple)\s*(?:of)?\s*(\d+)\s*(?:and|,|&)\s*(\d+)/i);
  if(m){
    const a=+m[1],b=+m[2],gcd=(x,y)=>y===0?x:gcd(y,x%y),lcm=(a*b)/gcd(a,b);
    return{
      t:'Lowest Common Multiple (LCM)',
      raw:lcm,
      v:String(lcm),
      rows:[
        ['LCM', String(lcm)],
        ['HCF / GCD', String(gcd(a,b))],
        ['Product (A × B)', String(a*b)]
      ],
      s:`LCM of ${a} and ${b} = (${a} × ${b}) ÷ HCF(${gcd(a,b)}) = ${lcm}`
    };
  }
  m=q.match(/(?:hcf|gcd|greatest common divisor)\s*(?:of)?\s*(\d+)\s*(?:and|,|&)\s*(\d+)/i);
  if(m){
    const a=+m[1],b=+m[2],gcd=(x,y)=>y===0?x:gcd(y,x%y);
    return{
      t:'Highest Common Factor (HCF / GCD)',
      raw:gcd(a,b),
      v:String(gcd(a,b)),
      rows:[
        ['HCF / GCD', String(gcd(a,b))],
        ['Numbers', `${a}, ${b}`]
      ],
      s:`HCF of ${a} and ${b} = ${gcd(a,b)}`
    };
  }
  m=q.match(/(\d+)\s*([cp])\s*(\d+)/i)||q.match(/(\d+)\s*(?:combinations?|permute|permutations?)\s*(?:of)?\s*(\d+)/i);
  if(m){
    const n=+m[1],r=+m[3]||+m[2],isC=/c|combination/i.test(m[2]||q);
    if(n>=r&&n<=100){
      let res=1;
      if(isC){
        for(let i=1;i<=r;i++)res=res*(n-i+1)/i;
        return{
          t:'Combinations (nCr)',
          raw:res,
          v:fmt(res),
          rows:[
            ['Total Combinations', fmt(res)],
            ['Formula', 'n! ÷ (r! × (n−r)!)'],
            ['Total Items (n)', String(n)],
            ['Chosen Items (r)', String(r)]
          ],
          s:`${n}C${r} = ${n}! ÷ (${r}! × (${n}−${r})!) = ${fmt(res)}`
        };
      }else{
        for(let i=0;i<r;i++)res*=(n-i);
        return{
          t:'Permutations (nPr)',
          raw:res,
          v:fmt(res),
          rows:[
            ['Total Permutations', fmt(res)],
            ['Formula', 'n! ÷ (n−r)!'],
            ['Total Items (n)', String(n)],
            ['Arranged (r)', String(r)]
          ],
          s:`${n}P${r} = ${n}! ÷ (${n}−${r})! = ${fmt(res)}`
        };
      }
    }
  }
  m=q.match(/(?:is\s*)?(\d+)\s*(?:is\s*)?prime\??/i);
  if(m){
    const num=+m[1];
    if(num<=1)return{t:'Prime Check',raw:null,v:'Not Prime',s:`${num} is neither prime nor composite.`};
    let isP=true;
    for(let i=2;i*i<=num;i++)if(num%i===0){isP=false;break;}
    return{
      t:'Prime Number Test',
      raw:num,
      v:isP?'PRIME NUMBER':'COMPOSITE (Not Prime)',
      rows:[
        ['Number Tested', String(num)],
        ['Result', isP?'Prime (Only factors are 1 & itself)':'Composite (Divisible by other numbers)']
      ],
      s:isP?`${num} has no divisors except 1 and itself.`:`${num} is composite.`
    };
  }
  return null;
}

/* I. Geometry & Mensuration */
function solveGeometry(q){
  let m=q.match(/(?:area of circle|circle area).*?(?:radius|r)\s*(?:is|=)?\s*(\d+\.?\d*)/i)||q.match(/(?:radius|r)\s*(?:is|=)?\s*(\d+\.?\d*).*?(?:area of circle|circle area)/i);
  if(m){
    const r=+m[1],a=Math.PI*r*r;
    return{
      t:'Area of Circle',
      raw:a,
      v:fmt(a,2),
      rows:[
        ['Circle Area', fmt(a,2)],
        ['Radius (r)', String(r)],
        ['Diameter (2r)', String(2*r)],
        ['Circumference (2πr)', fmt(2*Math.PI*r,2)]
      ],
      s:`Formula: π × r² = π × ${r}² = ${fmt(a,4)}`
    };
  }
  m=q.match(/(?:hypotenuse|pythagoras).*?(\d+\.?\d*).*?(\d+\.?\d*)/i);
  if(m){
    const a=+m[1],b=+m[2],h=Math.hypot(a,b);
    return{
      t:'Hypotenuse (Pythagoras)',
      raw:h,
      v:fmt(h,2),
      rows:[
        ['Hypotenuse (c)', fmt(h,2)],
        ['Side a (Base)', String(a)],
        ['Side b (Height)', String(b)],
        ['Formula', 'c = √(a² + b²)']
      ],
      s:`√(${a}² + ${b}²) = √(${a*a+b*b}) = ${fmt(h,2)}`
    };
  }
  return null;
}

/* Master Single Query Processor */
function prep(q){
  q=q.toLowerCase().replace(/[₹$,]|\brs\.?\s|\binr\b/g,'').replace(/(\d)\s*(?:lakhs?|lacs?)\b/g,'$1e5').replace(/(\d)\s*(?:crores?|cr)\b/g,'$1e7').replace(/(\d)\s*k\b/g,'$1e3').replace(/(\d)\s*(?:million|mn)\b/g,'$1e6');
  return q.replace(/(\d+\.?\d*)e(\d)/g,(m,a,b)=>String(+(a+'e'+b)));
}

function solveSingleQuery(raw){
  const q=prep(raw);
  const solvers=[solveStats,solveSpeedDistance,solveDerivative,alg,solveEquation,solveTimeWork,solveProfitLoss,solveNumberTheory,solveGeometry];
  for(let s of solvers){
    try{const r=s(raw)||s(q);if(r)return r;}catch{}
  }

  const n=(q.match(/\d+\.?\d*/g)||[]).map(Number),pm=q.match(/(\d+\.?\d*)\s*(?:%|percent)/);
  const rem=pm?q.replace(pm[0],' '):q,b0=+((rem.match(/\d+\.?\d*/)||[])[0]),mo=/month/.test(q),has=!isNaN(b0);
  const R=(t,raw,v,s,rows)=>({t,raw,v:v==null?fmt(raw):v,s,rows});let m;

  if(m=q.match(/(\d+\.?\d*)\s*(?:%|percent)\s*of\s*(\d+\.?\d*)/)){
    const ans=m[1]*m[2]/100;
    return R('Percentage Calculation',ans,null,`${fmt(+m[2])} × ${m[1]} ÷ 100`,[
      ['Calculated Value', fmt(ans)],
      ['Percentage', `${m[1]}%`],
      ['Base Amount', fmt(+m[2])]
    ]);
  }
  if(/gst/.test(q)&&has){
    const r=pm?+pm[1]:18;
    if(/remove|exclud|inclusive|include|from|without|reverse/.test(q)){
      const b=b0/(1+r/100),g=b0-b;
      return R('Price before GST',b,fm(b),`GST ${fm(g)} at ${r}%`,[
        ['Price without GST', fm(b)],
        ['Total with GST', fm(b0)],
        [`GST Amount (${r}%)`, fm(g)]
      ]);
    }
    const g=b0*r/100,tot=b0+g;
    return R('Total with GST',tot,fm(tot),`GST ${fm(g)} at ${r}%`,[
      ['Total with GST', fm(tot)],
      ['Original Amount', fm(b0)],
      [`GST Amount (${r}%)`, fm(g)]
    ]);
  }
  if(/\btips?\b/.test(q)&&has){
    const r=pm?+pm[1]:10,t=b0*r/100;
    return R('Tip Calculation',t,fm(t),`Bill ${fm(b0)} + tip = ${fm(b0+t)}`,[
      ['Tip Amount', fm(t)],
      ['Total Bill with Tip', fm(b0+t)],
      ['Original Bill', fm(b0)]
    ]);
  }
  if(/emi|loan/.test(q)&&n.length>2){
    const[P,Rt,T0]=n,N=Math.round(mo&&!/year/.test(q)?T0:T0*12),i=Rt/1200,e=i?P*i*(1+i)**N/((1+i)**N-1):P/N;
    return R('Monthly EMI',e,fm(e),`Interest ${fm(e*N-P)} · Total ${fm(e*N)} over ${N} months`,[
      ['Monthly EMI', fm(e)],
      ['Total Interest Payable', fm(e*N-P)],
      ['Total Amount Payable', fm(e*N)],
      ['Principal Loan', fm(P)],
      ['Tenure', `${N} months (${fmt(N/12)} years)`]
    ]);
  }
  if(/compound/.test(q)&&n.length>2){
    const[P,Rt,T0]=n,T=mo?T0/12:T0,A=P*(1+Rt/100)**T;
    return R('Compound Interest',A-P,fm(A-P),`Maturity ${fm(A)} · compounded yearly`,[
      ['Interest Earned', fm(A-P)],
      ['Maturity Value', fm(A)],
      ['Principal Invested', fm(P)],
      ['Time Period', `${T} years`]
    ]);
  }
  if(/simple|\bsi\b|interest/.test(q)&&n.length>2){
    const[P,Rt,T0]=n,T=mo?T0/12:T0,I=P*Rt*T/100;
    return R('Simple Interest',I,fm(I),`Total ${fm(P+I)} · P × R × T ÷ 100`,[
      ['Interest Amount', fm(I)],
      ['Total Maturity', fm(P+I)],
      ['Principal', fm(P)]
    ]);
  }
  if(mo&&/daily|per day|a day|hourly|per hour|yearly|annual|per year|weekly/.test(q)&&n.length){
    const x=n[0];
    return R('Salary Breakdown',x,fm(x),'Calculated based on standard working schedule',[
      ['Monthly Salary', fm(x)],
      ['Daily (30 days)', fm(x/30)],
      ['Daily (26 working days)', fm(x/26)],
      ['Hourly (8 hrs/day)', fm(x/240)],
      ['Annual Package (CTC)', fm(x*12)]
    ]);
  }
  if(m=q.match(/(?:half|1\/2)\s*(?:of)?\s*(\d+\.?\d*)/))return R('Half',m[1]/2,null,`${m[1]} ÷ 2`);
  if(m=q.match(/(?:double|twice)\s*(?:of)?\s*(\d+\.?\d*)/))return R('Double',m[1]*2,null,`${m[1]} × 2`);
  if(m=q.match(/(?:cube root|cbrt)\s*(?:of)?\s*(\d+\.?\d*)/))return R('Cube Root',Math.cbrt(m[1]),null,`∛${m[1]}`);
  if(m=q.match(/(?:square root|sqrt|√)\s*(?:of)?\s*(\d+\.?\d*)/))return R('Square Root',Math.sqrt(m[1]),null,`√${m[1]}`);
  if(m=q.match(/(\d+\.?\d*)\s*(squared|cubed)/)){
    const p=m[2]==='squared'?2:3;
    return R(m[2]==='squared'?'Square':'Cube',m[1]**p,null,`${m[1]}^${p}`);
  }
  if(m=q.match(/(\d+\.?\d*)\s*(?:\^|\*\*|to the power(?: of)?|power)\s*(\d+\.?\d*)/))return R('Power Calculation',m[1]**m[2],null,`${m[1]}^${m[2]}`);
  if((m=q.match(/(\d+)\s*(?:factorial|!)/))&&+m[1]<=170){
    let f=1;for(let i=2;i<=+m[1];i++)f*=i;
    return R('Factorial',f,null,`${m[1]}!`);
  }
  if(m=q.match(/(\d+\.?\d*)\s*([a-z°²³\/]+)\s*(?:to|in|into)\s*([a-z°²³\/]+)/)){
    const a=ul(m[2]),b=ul(m[3]),c=Object.keys(U).find(k=>a in U[k]&&b in U[k]);
    if(c){
      const r=conv(c,a,b,+m[1]);
      return R(c+' Conversion',r,`${fmt(r,6)} ${LB[b]||b}`,`${fmt(+m[1])} ${LB[a]||a} = ${fmt(r,6)} ${LB[b]||b}`,[
        ['Converted Value', `${fmt(r,6)} ${LB[b]||b}`],
        ['From Value', `${fmt(+m[1])} ${LB[a]||a}`],
        ['Category', c]
      ]);
    }
  }

  const s=q.replace(/what is|what's|calculate|find|compute|evaluate|=|\?/g,' ')
           .replace(/multiplied by|multiply|times|\bx\b|\binto\b/g,'×')
           .replace(/divided by|divide|\bover\b/g,'÷')
           .replace(/\bplus\b/g,'+')
           .replace(/\bminus\b/g,'−')
           .replace(/\bof\b/g,'×')
           .replace(/squared/g,'^2')
           .replace(/\s+/g,'');
  const r=ev(s);
  return R('Result',r,null,s.replace(/([×÷−+])/g,' $1 '));
}

function processAllQueries(raw){
  const quoted=[];
  const re=/"([^"]+)"|'([^']+)'/g;
  let m;
  while((m=re.exec(raw))!==null){
    quoted.push(m[1]||m[2]);
  }
  const queries=quoted.length>0?quoted:[raw];
  const list=[];
  for(let item of queries){
    item=item.trim();if(!item)continue;
    try{
      const res=solveSingleQuery(item);
      if(res)list.push({query:item,...res});
    }catch{}
  }
  return list;
}

async function fetchPythonSolutions(q){
  // 1. PyWebView Desktop Native Bridge
  if(window.pywebview&&window.pywebview.api&&window.pywebview.api.solve){
    try{
      const resStr=await window.pywebview.api.solve(q);
      const data=JSON.parse(resStr);
      if(data&&data.results&&data.results.length>0){
        return data.results.map(r=>({
          t:r.title,
          v:r.summary_value,
          rows:r.rows,
          s:r.formula,
          steps:r.steps,
          insights:r.insights,
          raw:r.raw,
          query:r.query
        }));
      }
    }catch(e){}
  }

  // 2. Local Python HTTP Engine
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),1500);
    const resp=await fetch('http://127.0.0.1:8765/api/solve',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q}),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    if(resp.ok){
      const data=await resp.json();
      if(data&&data.results&&data.results.length>0){
        return data.results.map(r=>({
          t:r.title,
          v:r.summary_value,
          rows:r.rows,
          s:r.formula,
          steps:r.steps,
          insights:r.insights,
          raw:r.raw,
          query:r.query
        }));
      }
    }
  }catch(e){}

  // 3. Client-side JS Fallback
  return processAllQueries(q);
}

        const stWrap=document.createElement('div');
        stWrap.className='steps-wrap';

        const btn=document.createElement('button');
        btn.type='button';
        btn.className='step-toggle';
        btn.innerHTML=`<span>🪜 Step-by-Step Reasoning</span><svg class="arr" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5L5 6.5L8 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;

          expr=rw(a.raw);prev='';eq=true;lastOp=null;render();

      hist.unshift({e:a.query||q,r:a.v||a.rows?.[0]?.[1]||'Calculated',raw:a.raw,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});

function extractLastOp(s){
  if(!s)return null;
  const m=s.match(/([+\-−×÷^])\s*([0-9.]+%?|π|e|[A-Za-z]+\([^)]*\)|\([^)]*\))$/);
  if(!m||m.index===0)return null;
  const prefix=s.slice(0,m.index).trim();
  if(/[+\-−×÷^(]$/.test(prefix))return null;
  return{op:m[1],val:m[2]};
}

let tt;
function toast(m){
  const t=$('#toast');
  t.textContent=m;
  t.classList.add('on');
  clearTimeout(tt);

const copy=t=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard'),()=>toast('Copy unavailable'));

const OPS='÷×−+^',FNS=['sin','cos','tan','log','ln'];

function render(){
  const e=$('#expr'),r=$('#res'),p=calc(expr);
  e.textContent=eq?prev:expr;
  e.scrollLeft=e.scrollWidth;
  const nt=p==null?'0':fmt(p);
  if(nt!==r.textContent){
    r.classList.remove('bump');
    void r.offsetWidth;
    r.classList.add('bump');
  }
  r.textContent=nt;

  const L=r.textContent.length;
  r.style.fontSize=(L>16?16:L>13?20:L>10?26:L>8?32:L>6?38:44)+'px';

  const last=expr.slice(-1);

  $('#modeBadge').textContent=deg?'DEG':'RAD';
  $('#tDeg').textContent=deg?'DEG':'RAD';
}

function press(k){
  const num=/^[0-9]$/.test(k),last=expr.slice(-1);
  if(k==='AC'){
    expr='';prev='';eq=false;lastOp=null;
  }else if(k==='⌫'){
    if(eq){expr='';eq=false;lastOp=null;}
    else{
      expr=expr.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|√\(|.)$/,'');
      lastOp=null;
    }
  }else if(k==='='){
    if(eq && lastOp && expr){
      const repeatExpr=expr+lastOp.op+lastOp.val;
      const r=calc(repeatExpr);
      if(r!=null){
        hist.unshift({e:repeatExpr,r:fmt(r),raw:r,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
        save();
        prev=expr+' '+lastOp.op+' '+lastOp.val+' =';
        expr=rw(r);
        eq=true;
        renderHist();
        const dp=$('.disp');
        dp.classList.remove('flash');
        void dp.offsetWidth;
        dp.classList.add('flash');
        render();
        return;
      }
    }
    const r=calc(expr);
    if(r==null||!expr)return toast('Can’t calculate that');
    lastOp=extractLastOp(expr);
    hist.unshift({e:expr,r:fmt(r),raw:r,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    save();
    prev=expr+' =';
    expr=rw(r);
    eq=true;
    renderHist();
    const dp=$('.disp');
    dp.classList.remove('flash');
    void dp.offsetWidth;
    dp.classList.add('flash');
  }else{
    if(eq&&(num||k==='.'||k==='('||k==='π'||k==='√'||FNS.includes(k))){
      expr='';
      lastOp=null;
    }
    if(OPS.includes(k)){
      lastOp=null;
    }
    eq=false;
    const seg=(expr.match(/\d*\.?\d*$/)||[''])[0];
    if(num){
      expr=seg==='0'?expr.slice(0,-1)+k:expr+k;
    }else if(k==='.'){
      if(!seg.includes('.'))expr+=seg===''?'0.':'.';
    }else if(OPS.includes(k)){
      if(!expr){if(k==='−')expr='−';}
      else if(OPS.includes(last)){if(expr.length>1)expr=expr.slice(0,-1)+k;}
      else if(last!=='('||k==='−')expr+=k;
    }else if(k==='%'){
      if(/[\d)]/.test(last))expr+='%';
    }else if(k===')'){
      const o=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
      if(o>0&&last&&!OPS.includes(last)&&last!=='(')expr+=')';
    }else if(k==='('){
      expr+='(';
    }else if(k==='π'){
      expr+='π';
    }else if(k==='√'){
      expr+='√(';
    }else if(FNS.includes(k)){
      expr+=k+'(';
    }
  }
  render();
}

    'p':'π','P':'π',
    's':'sin','c':'cos','t':'tan','l':'log','r':'√','q':'√'
  };
  const k=M[e.key]||e.key;
  if(/^[0-9.+%^()=]$/.test(k)||['×','÷','−','⌫','AC','π','sin','cos','tan','log','ln','√'].includes(k)){
    e.preventDefault();

});

/* Units Data */
const U={
  Length:{m:1,km:1e3,cm:.01,mm:.001,mi:1609.344,yd:.9144,ft:.3048,in:.0254},
  Weight:{kg:1,g:.001,mg:1e-6,t:1000,lb:.45359237,oz:.028349523},
  Temperature:{c:1,f:1,k:1},
  Area:{'m²':1,'km²':1e6,ha:1e4,acre:4046.8564,'ft²':.09290304,'cm²':1e-4},
  Volume:{l:1,ml:.001,gal:3.785411784,'m³':1000,cup:.2365882365},
  Speed:{'m/s':1,'km/h':1/3.6,mph:.44704,kn:.514444},
  Data:{b:1,kb:1024,mb:1048576,gb:1073741824,tb:1099511627776},
  Time:{s:1,min:60,h:3600,d:86400,wk:604800}
};
const LB={c:'°C',f:'°F',k:'K'};
const AS={kilometer:'km',kilometre:'km',meter:'m',metre:'m',mile:'mi',foot:'ft',feet:'ft',inch:'in',inches:'in',centimeter:'cm',centimetre:'cm',millimeter:'mm',yard:'yd',kilogram:'kg',kilo:'kg',gram:'g',pound:'lb',lbs:'lb',ounce:'oz',tonne:'t',ton:'t',litre:'l',liter:'l',millilitre:'ml',gallon:'gal',hour:'h',hr:'h',minute:'min',second:'s',sec:'s',day:'d',week:'wk',celsius:'c',centigrade:'c',fahrenheit:'f',kelvin:'k',hectare:'ha',byte:'b',kilobyte:'kb',megabyte:'mb',gigabyte:'gb',terabyte:'tb',kph:'km/h',kmph:'km/h',knot:'kn',sqm:'m²',sqft:'ft²'};
const ul=w=>{w=w.replace('°','');return AS[w]||AS[w.replace(/s$/,'')]||w;};
const conv=(c,a,b,x)=>{
  if(c==='Temperature'){
    const t=a==='c'?x:a==='f'?(x-32)*5/9:x-273.15;
    return b==='c'?t:b==='f'?t*9/5+32:t+273.15;
  }
  return x*U[c][a]/U[c][b];
};

/* Tools Tab Pre-built Widgets */
const TL=[
  {n:'EMI',f:[['Loan amount',2500000],['Interest % per year',8.5],['Years',20]],c:([p,r,y])=>{const i=r/1200,n=y*12,e=i?p*i*(1+i)**n/((1+i)**n-1):p/n;return[['Monthly EMI',fm(e),1],['Total interest',fm(e*n-p)],['Total payable',fm(e*n)]]}},
  {n:'SIP',f:[['Monthly investment',10000],['Expected return % per year',12],['Years',10]],c:([p,r,y])=>{const i=r/1200,n=y*12,v=i?p*((1+i)**n-1)/i*(1+i):p*n;return[['Future value',fm(v),1],['Invested',fm(p*n)],['Estimated returns',fm(v-p*n)]]}},
  {n:'Add GST',f:[['Amount',4999],['GST %',18]],c:([a,r])=>[['Total',fm(a*(1+r/100)),1],['GST',fm(a*r/100)]]},
  {n:'Remove GST',f:[['Amount with GST',5899],['GST %',18]],c:([a,r])=>{const b=a/(1+r/100);return[['Price before GST',fm(b),1],['GST',fm(a-b)]]}},
  {n:'Discount',f:[['Price',2999],['Discount %',20]],c:([p,d])=>[['You pay',fm(p*(1-d/100)),1],['You save',fm(p*d/100)]]},
  {n:'Compound',f:[['Principal',100000],['Rate % per year',7],['Years',5]],c:([p,r,y])=>{const a=p*(1+r/100)**y;return[['Maturity value',fm(a),1],['Interest earned',fm(a-p)]]}},
  {n:'Split bill',f:[['Bill',3200],['Tip %',10],['People',4]],c:([b,t,n])=>{const T=b*(1+t/100);return[['Each pays',fm(T/n),1],['Total with tip',fm(T)]]}}
];
let ti=0;
$('#tchips').innerHTML=TL.map((t,i)=>`<button class="chip" data-t="${i}">${t.n}</button>`).join('');
function tcalc(){
  const v=$$('#tform input').map(x=>+x.value||0);
  $('#tres').innerHTML=TL[ti].c(v).map(([l,x,b])=>`<div class="row${b?' big':''}"><span>${l}</span><b class="copyable" title="Tap to copy">${x}</b></div>`).join('');
}
function tool(i){
  ti=i;
  $$('#tchips .chip').forEach((c,j)=>c.classList.toggle('on',j===i));
  $('#tform').innerHTML=TL[i].f.map(([l,v])=>`<label class="fld"><span>${l}</span><input class="in" type="number" inputmode="decimal" step="any" value="${v}"></label>`).join('');
  tcalc();
}
$('#tform').addEventListener('input',tcalc);
$('#tchips').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)tool(+b.dataset.t);});

/* Unit Converter */
let cc='Length';
$('#cchips').innerHTML=Object.keys(U).map(k=>`<button class="chip" data-c="${k}">${k}</button>`).join('');
function cupd(){
  const r=conv(cc,$('#cf').value,$('#ct').value,+$('#cv1').value);
  $('#cv2').textContent=isFinite(r)?fmt(r,6):'—';
}
function ccat(k){
  cc=k;
  $$('#cchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===k));
  const o=Object.keys(U[k]).map(x=>`<option value="${x}">${LB[x]||x}</option>`).join('');
  $('#cf').innerHTML=o;
  $('#ct').innerHTML=o;
  $('#ct').selectedIndex=1;
  cupd();
}
$('#cchips').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b)ccat(b.dataset.c);});
['#cv1','#cf','#ct'].forEach(s=>$(s).addEventListener('input',cupd));
$('#swap').onclick=()=>{
  const a=$('#cf').value;
  $('#cf').value=$('#ct').value;
  $('#ct').value=a;
  cupd();
  haptic(15);
};

/* Calculation History */
function renderHist(){
  const h=$('#hist');
  h.innerHTML=hist.length?hist.slice(0,50).map((x,i)=>`
    <button class="hi" data-h="${i}" style="--i:${i}">
      <span>${x.e}</span>
      <b>${x.r}</b>
    </button>`).join(''):'<p class="empty">Your calculations will show up here.</p>';
  $('#hclr').hidden=!hist.length;
}
$('#hist').addEventListener('click',e=>{
  const b=e.target.closest('[data-h]');
  if(!b)return;
  const x=hist[+b.dataset.h];
  if(x&&x.raw!=null&&isFinite(x.raw)){
    expr=rw(x.raw);
    prev=x.e;
    eq=true;
    lastOp=extractLastOp(x.e);
    render();
    closeAll();
    toast('Loaded into calculator');
  }
});
$('#hclr').onclick=()=>{
  hist=[];
  save();
  renderHist();
  toast('History cleared');
};

/* Tab Navigation */
const tabs=$$('#tabs button');
function show(i){
  tabs.forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  $('.thumb').style.transform=`translateX(${i*100}%)`;
  $$('.view').forEach((v,j)=>v.classList.toggle('on',j===i));
}
tabs.forEach((b,i)=>b.onclick=()=>{show(i);haptic(15);});

/* Apps Launcher & Sheet Modal */
const sh=$('#sheet'),ln=$('#launch');
const closeAll=()=>{
  sh.classList.remove('on');
  ln.classList.remove('on');
  $('#apps').classList.remove('open');
};
const openSheet=i=>{
  ln.classList.remove('on');
  $('#apps').classList.remove('open');
  sh.classList.add('on');
  show(i);
  if(i===0&&matchMedia('(hover:hover)').matches)setTimeout(()=>$('#q').focus(),350);
};
$('#apps').onclick=()=>{
  haptic(15);
  $('#apps').classList.toggle('open',ln.classList.toggle('on'));
};
ln.addEventListener('click',e=>{
  if(e.target===ln)return closeAll();
  const t=e.target.closest('[data-open],[data-act]');
  if(!t)return;
  haptic(15);
  if(t.dataset.open!=null)openSheet(+t.dataset.open);
  else{
    const act=t.dataset.act;
    if(act==='sciT'){
      toggleSci();
      closeAll();
    }else if(act==='degT'){
      deg=!deg;
      render();
      toast(`Switched to ${deg?'Degree':'Radian'} mode`);
    }
  }
});
sh.addEventListener('click',e=>{if(e.target===sh)closeAll();});
$('#close').onclick=closeAll;

/* Visual Effects: Ripple & 3D Tilt */
function ripple(b,e){
  if(!b.classList.contains('k'))return;
  const r=b.getBoundingClientRect();
  const s=Math.max(r.width,r.height)*1.6;
  const x=e.clientX?e.clientX-r.left:r.width/2;
  const y=e.clientY?e.clientY-r.top:r.height/2;
  const i=document.createElement('i');
  i.className='rip';
  i.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px`;
  b.append(i);
  setTimeout(()=>i.remove(),580);
}

(()=>{
  const cd=$('.calc'),fine=matchMedia('(hover:hover)').matches,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let mx=-1e3,my=-1e3,targetRx=0,targetRy=0,curRx=0,curRy=0;

  addEventListener('pointermove',e=>{
    mx=e.clientX;my=e.clientY;
    const g=e.target.closest&&e.target.closest('.glass');
    if(g){
      const b=g.getBoundingClientRect();
      g.style.setProperty('--mx',e.clientX-b.left+'px');
      g.style.setProperty('--my',e.clientY-b.top+'px');
    }
    if(fine&&!calm){
      targetRy=Math.max(-1,Math.min(1,(e.clientX/innerWidth-.5)*2))*5;
      targetRx=Math.max(-1,Math.min(1,(e.clientY/innerHeight-.5)*2))*-5;
    }
  });

  const resetPointer=()=>{
    mx=-1e3;my=-1e3;targetRx=0;targetRy=0;
  };
  document.addEventListener('pointerleave',resetPointer);
  document.addEventListener('pointerup',resetPointer);

  const cv=$('#fx'),c=cv.getContext('2d');
  if(!c||calm)return;
  let W,H,P=[],col='#fff',n=0,dpr=window.devicePixelRatio||1;

  const rs=()=>{
    dpr=window.devicePixelRatio||1;
    W=innerWidth;
    H=innerHeight;
    cv.width=W*dpr;
    cv.height=H*dpr;
    c.scale(dpr,dpr);
    P=Array.from({length:Math.min(75,Math.floor(W*H/17000))},()=>({
      x:Math.random()*W,
      y:Math.random()*H,
      vx:(Math.random()-.5)*.28,
      vy:(Math.random()-.5)*.28,
      r:Math.random()*1.3+.6
    }));
  };
  addEventListener('resize',rs);
  rs();

  (function loop(){
    if(!document.hidden){
      if(fine&&!calm){
        curRx+=(targetRx-curRx)*0.1;
        curRy+=(targetRy-curRy)*0.1;
        cd.style.transform=`rotateY(${curRy.toFixed(2)}deg) rotateX(${curRx.toFixed(2)}deg)`;
      }
      if(n++%30===0)col=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#fff';
      c.clearRect(0,0,W,H);
      c.fillStyle=c.strokeStyle=col;

      for(const p of P){
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0||p.x>W)p.vx*=-1;
        if(p.y<0||p.y>H)p.vy*=-1;
        const dx=p.x-mx,dy=p.y-my,d=Math.hypot(dx,dy);
        if(d<120&&d>0){p.x+=dx/d*.8;p.y+=dy/d*.8;}
        c.globalAlpha=.45;
        c.beginPath();
        c.arc(p.x,p.y,p.r,0,6.283);
        c.fill();
      }
      for(let i=0;i<P.length;i++){
        for(let j=i+1;j<P.length;j++){
          const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
          if(d<110){
            c.globalAlpha=(1-d/110)*.18;
            c.beginPath();
            c.moveTo(P[i].x,P[i].y);
            c.lineTo(P[j].x,P[j].y);
            c.stroke();
          }
        }
      }
    }
    requestAnimationFrame(loop);
  })();
})();

/* Dynamic PWA Injection (Zero CORS Error on file:// protocol) */
if(location.protocol.startsWith('http')){
  const l=document.createElement('link');
  l.rel='manifest';
  l.href='manifest.json';
  document.head.appendChild(l);
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
}

/* Initial Boot */
render();
renderHist();
tool(0);
ccat('Length');
show(0);
</script>
